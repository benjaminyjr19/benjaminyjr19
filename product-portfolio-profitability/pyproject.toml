[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-profitability"
version = "1.0.0"
description = "Multiple linear regression on product lifetime contribution profit"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scikit-learn==1.5.2",
    "statsmodels==0.14.4",
    "matplotlib==3.9.2",
]

[project.optional-dependencies]
notebook = [
    "ipykernel==6.29.5",
    "ipython==9.16.0",
    "jupyterlab==4.2.5",
    "nbclient==0.10.0",
    "nbformat==5.10.4",
]
dev = ["pytest==8.3.3"]

[project.scripts]
portfolio-profitability = "portfolio_profitability.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q --strict-markers"
# A FutureWarning means this code is using an interface that is going away, so
# it fails the build. Third party deprecations raised while importing a
# dependency are outside this project's control and are left as warnings.
filterwarnings = [
    "error::FutureWarning",
    "ignore::DeprecationWarning:pyparsing.*",
    "ignore::DeprecationWarning:matplotlib.*",
]
